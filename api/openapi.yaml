openapi: 3.0.3
info: {title: Lyra API, version: 0.1.0}
paths:
  /v1/identify:
    post:
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [audio], properties: {audio: {type: string, format: binary}}}}}}
      responses: {'200': {description: Match, no-match, or insufficient signal; headers: {X-Request-ID: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/IdentifyResponse'}}}}}
  /health/live:
    get: {responses: {'200': {description: Process alive}}}
  /health/ready:
    get: {responses: {'200': {description: Ready}}}
  /v1/admin/auth/login:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Login'}}}}
      responses: {'200': {description: Session established; the HttpOnly cookie is set and the body includes a CSRF token}, '401': {description: Invalid credentials}, '429': {description: Rate limited}}
  /v1/admin/auth/logout:
    post:
      security: [{AdminSession: []}]
      responses: {'204': {description: Session removed}}
  /v1/admin/auth/session:
    get:
      security: [{AdminSession: []}]
      responses: {'200': {description: Valid session}, '401': {description: No valid session}}
  /v1/admin/tracks:
    post:
      security: [{AdminSession: [], CSRFToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateTrack'}}}}
      responses: {'201': {description: Created}, '401': {description: No valid session}, '403': {description: CSRF check failed}}
    get: {security: [{AdminSession: []}], responses: {'200': {description: Tracks}}}
  /v1/admin/tracks/{id}:
    get: {security: [{AdminSession: []}], responses: {'200': {description: Track}, '404': {description: Not found}}}
    delete: {security: [{AdminSession: [], CSRFToken: []}], responses: {'204': {description: Deleted}}}
  /v1/admin/tracks/{id}/audio:
    post:
      security: [{AdminSession: [], CSRFToken: []}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [audio], properties: {audio: {type: string, format: binary}}}}}}
      responses: {'202': {description: Reference audio stored and indexing queued}}
components:
  securitySchemes:
    AdminSession: {type: apiKey, in: cookie, name: lyra_admin_session}
    CSRFToken: {type: apiKey, in: header, name: X-CSRF-Token}
  schemas:
    Login:
      type: object
      required: [username, password]
      properties: {username: {type: string}, password: {type: string, format: password}}
    CreateTrack:
      type: object
      required: [title, artist]
      properties: {title: {type: string}, artist: {type: string}, album: {type: string, nullable: true}}
    IdentifyResponse:
      type: object
      required: [request_id, matched, match, processing_ms]
      properties:
        request_id: {type: string}
        matched: {type: boolean}
        reason: {type: string, enum: [insufficient_audio_signal]}
        match: {$ref: '#/components/schemas/IdentifyMatch', nullable: true}
        processing_ms: {type: integer, format: int64}
    IdentifyMatch:
      type: object
      required: [track_id, title, artist, confidence, match_strength, reference_offset_ms]
      properties:
        track_id: {type: string}
        title: {type: string}
        artist: {type: string}
        album: {type: string, nullable: true}
        confidence: {type: number, format: double, description: Internal temporal-concentration diagnostic; it is not a probability of correctness.}
        match_strength: {type: string, enum: [timing_aligned], description: The returned match passed Lyra's temporal-alignment evidence gates.}
        reference_offset_ms: {type: integer, format: int64}
