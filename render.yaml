services:
  - type: web
    name: lyra-api
    runtime: docker
    dockerCommand: serve
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ADDR
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_SECURE
        value: "true"
      - key: LYRA_ADMIN_USERNAME
        value: admin
      - key: LYRA_ADMIN_PASSWORD_HASH
        sync: false
      - key: LYRA_ADMIN_COOKIE_SECURE
        value: "true"
      - key: LYRA_ALLOWED_ORIGIN
        sync: false
  - type: worker
    name: lyra-worker
    runtime: docker
    dockerCommand: worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ADDR
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_SECURE
        value: "true"
