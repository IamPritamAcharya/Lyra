services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lyra
      POSTGRES_USER: lyra
      POSTGRES_PASSWORD: lyra
    ports: ["5432:5432"]
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: lyra-minio
      MINIO_ROOT_PASSWORD: lyra-minio-secret
    ports: ["9000:9000", "9001:9001"]
  lyra:
    build: .
    environment:
      LYRA_HTTP_ADDRESS: :8080
      LYRA_ADMIN_API_KEY: change-me
      DATABASE_URL: postgres://lyra:lyra@postgres:5432/lyra?sslmode=disable
      REDIS_ADDR: valkey:6379
      S3_ENDPOINT: minio:9000
    ports: ["8080:8080"]
    depends_on: [postgres, valkey, minio]
