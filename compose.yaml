services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lyra
      POSTGRES_USER: lyra
      POSTGRES_PASSWORD: lyra
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: lyra-minio
      MINIO_ROOT_PASSWORD: lyra-minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  adminer:
    image: adminer:4
    ports: ["8081:8080"]
    depends_on: [postgres]
  lyra:
    build: .
    environment:
      LYRA_HTTP_ADDRESS: :8080
      LYRA_ADMIN_USERNAME: admin
      # Development only. Change this password/hash before exposing the service.
      LYRA_ADMIN_PASSWORD_HASH: $$2y$$12$$D4ID04V5qqA/Em.wFpz09OEczShs.BUMm.QTcbPKkjAFwSdmuoKLC
      LYRA_ADMIN_COOKIE_SECURE: "false"
      DATABASE_URL: postgres://lyra:lyra@postgres:5432/lyra?sslmode=disable
      REDIS_ADDR: valkey:6379
      S3_ENDPOINT: minio:9000
    ports: ["8080:8080"]
    depends_on: [postgres, valkey, minio]

volumes:
  postgres_data:
  minio_data:
