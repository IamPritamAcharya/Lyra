services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lyra
      POSTGRES_USER: lyra
      POSTGRES_PASSWORD: lyra
    ports: ["5432:5432"]
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: lyra-minio
      MINIO_ROOT_PASSWORD: lyra-minio-secret
    ports: ["9000:9000", "9001:9001"]
  lyra:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [postgres, valkey, minio]
